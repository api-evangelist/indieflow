name: IndieFlow
description: >-
  IndieFlow is an all-in-one music management platform for independent artists
  and their managers, positioning itself as a "Shopify for musicians." Made by
  musicians, it centralizes the business side of an independent music career in
  one place: distributing releases to 30+ streaming services (Spotify, Apple
  Music, Tidal, Deezer, TikTok and more), collecting and registering royalties
  and songwriter/publisher credits with performing rights organizations,
  managing creative projects and release schedules, promoting music, booking
  gigs, and handling payments and collaborations. Founded in 2020, the company
  raised a $4M round led by State of Mind Ventures with participation from
  Techstars and other investors, and its artist-facing distribution is delivered
  through a Revelator-powered back end. IndieFlow does not currently publish a
  public developer API; this profile tracks the company's public web presence.
